# Targets built by the Bazel Central Registry CI to validate a new version of
# the perfetto module. They are built from another module, with perfetto as a
# dependency.

matrix:
  linux_platform: ["debian11", "ubuntu2204"]
  platform: ["debian11", "ubuntu2204", "macos", "macos_arm64"]
  bazel: ["8.x"]

tasks:
  verify_targets:
    name: Client library and trace processor
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    build_targets:
      - "@perfetto//:libperfetto_client_experimental"
      - "@perfetto//:trace_processor"
      - "@perfetto//:trace_processor_shell"
      - "@perfetto//:traceconv"

  verify_linux_targets:
    name: Tracing service and probes
    platform: ${{ linux_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    build_targets:
      - "@perfetto//:perfetto"
      - "@perfetto//:traced"
      - "@perfetto//:traced_probes"
