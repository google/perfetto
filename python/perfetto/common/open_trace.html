<!DOCTYPE html>
<!--
  Bootstrap page served by python/perfetto/common/open_trace_server.py when the
  browser runs on a different machine than the trace. It fetches the trace
  same-origin (so it works behind an http reverse proxy) and hands it over to
  the Perfetto UI via postMessage.
  {{UI_URL}} and {{FNAME}} are substituted server-side with JSON literals.
-->
<html>

<head>
  <meta charset="utf-8">
  <title>Opening Trace in Perfetto UI...</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e1e1e;
      color: #fff;
      font-family: sans-serif;
      gap: 16px;
    }

    #open-btn {
      display: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="status">Downloading trace...</div>
  <button id="open-btn">Open Trace in Perfetto UI</button>
  <script>
    const uiUrl = {{UI_URL}};
    const fname = {{FNAME}};
    const uiOrigin = new URL(uiUrl).origin;
    const statusEl = document.getElementById('status');
    const openBtn = document.getElementById('open-btn');
    let win = window.open(uiUrl, '_blank');
    let buf = null;

    // The UI replies 'PONG' once it's ready to receive the trace. We don't know
    // when that happens, so just keep asking.
    const timer = setInterval(() => {
      if (win && !win.closed) {
        win.postMessage('PING', uiOrigin);
      }
    }, 200);

    openBtn.onclick = () => {
      win = window.open(uiUrl, '_blank');
      openBtn.style.display = 'none';
    };

    fetch('/' + fname)
      .then((r) => r.arrayBuffer())
      .then((ab) => {
        buf = ab;
        if (!win || win.closed) {
          // The popup was blocked, let the user open it with a click.
          statusEl.textContent = 'Trace downloaded. Click below to open it:';
          openBtn.style.display = 'block';
        }
      })
      .catch((e) => {
        clearInterval(timer);
        statusEl.textContent = 'Failed to download the trace: ' + e;
      });

    window.onmessage = (e) => {
      if (e.source !== win || e.data !== 'PONG' || !buf) return;
      clearInterval(timer);
      win.postMessage(
        { perfetto: { buffer: buf, title: fname, fileName: fname } }, uiOrigin);
      statusEl.textContent = 'Trace sent to the Perfetto UI.';
      // Only works if this tab was itself opened by a script.
      setTimeout(() => window.close(), 300);
    };
  </script>
</body>

</html>
