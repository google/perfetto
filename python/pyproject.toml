# Build-system only; package metadata stays in setup.py. distutils was removed
# in Python 3.12, so declare setuptools explicitly.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
preset = "basic"
project-includes = ["perfetto"]
# Not shipped in the wheel (see setup.py).
project-excludes = ["perfetto/bigtrace*", "perfetto/experimental", "perfetto/tools"]
ignore-missing-imports = ["polars"]  # optional, not in .venv (~190 MB)
