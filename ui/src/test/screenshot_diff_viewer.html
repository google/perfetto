<!--
Single-page viewer for all failing screenshot comparisons of a Playwright run.
screenshot_diff_reporter.ts copies this file and replaces the placeholder in
the #diff-data script tag with a JSON object of the form:
  {
    ciJobId?: string,
    reportUrl?: string,  // Native Playwright HTML report.
    failures: [{
      testTitle: string,
      screenshotName: string,
      reportUrl?: string,  // This test's attempt in the native report.
      images: {expected?: string, actual?: string, diff?: string},
    }],
  }
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot diffs</title>
    <style>
      :root {
        --fg: #1f2328;
        --fg-muted: #59636e;
        --border: #d0d7de;
        --bg-subtle: #f6f8fa;
        --accent: #0969da;
        --danger: #cf222e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--fg);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Noto Sans',
          Helvetica,
          Arial,
          sans-serif;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 1600px;
        margin: 0 auto;
        padding: 16px 24px 48px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 8px 0;
      }
      .muted {
        color: var(--fg-muted);
      }
      .cmd-box {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0 16px;
        padding: 8px 12px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .cmd-box code {
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      button {
        font: inherit;
        color: var(--fg);
        background: #fff;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 10px;
      }
      button:hover {
        background: var(--bg-subtle);
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 0;
        margin-bottom: 8px;
        background: #fff;
        border-bottom: 1px solid var(--border);
      }
      .toolbar-label {
        font-weight: 600;
      }
      /* A row of joined buttons; the selected one is filled. */
      .segmented {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented button {
        border: none;
        border-right: 1px solid var(--border);
        border-radius: 0;
        padding: 5px 16px;
      }
      .segmented button:last-child {
        border-right: none;
      }
      .segmented button.selected {
        color: #fff;
        background: var(--accent);
        font-weight: 600;
      }
      .spacer {
        flex: 1;
      }
      details.card {
        border: 1px solid var(--border);
        border-radius: 6px;
        margin: 16px 0;
      }
      details.card > summary {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 8px 12px;
        background: var(--bg-subtle);
        border-radius: 6px;
        list-style: none;
        user-select: none;
      }
      details.card[open] > summary {
        border-bottom: 1px solid var(--border);
        border-radius: 6px 6px 0 0;
      }
      details.card > summary::-webkit-details-marker {
        display: none;
      }
      details.card > summary::before {
        content: '›';
        display: inline-block;
        width: 12px;
        font-weight: 600;
        transition: transform 0.1s;
      }
      details.card[open] > summary::before {
        transform: rotate(90deg);
      }
      .card-title {
        font-weight: 600;
      }
      .card-body {
        padding: 12px 16px 16px;
      }
      /*
       * All views of a card are stacked in the same grid cell and only the
       * selected one is visible. Hidden views still take up space, so the card
       * is always as tall as its tallest view and switching views never moves
       * the page.
       */
      .view {
        display: grid;
      }
      .view > .layer {
        grid-area: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        visibility: hidden;
      }
      .view > .layer.active {
        visibility: visible;
      }
      .view img {
        max-width: 100%;
        vertical-align: top;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      }
      .side-by-side {
        display: flex;
        gap: 16px;
        width: 100%;
      }
      .side-by-side > figure {
        flex: 1;
        min-width: 0;
        margin: 0;
        text-align: center;
      }
      figcaption {
        color: var(--fg-muted);
        margin-bottom: 4px;
      }
      .slider {
        position: relative;
        display: inline-block;
        max-width: 100%;
        cursor: ew-resize;
        touch-action: none;
        user-select: none;
      }
      .slider img {
        display: block;
        pointer-events: none;
      }
      .slider .overlay {
        position: absolute;
        top: 0;
        left: 0;
      }
      .slider .divider {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--danger);
      }
      .slider .label {
        position: absolute;
        top: 4px;
        padding: 0 6px;
        font-size: 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
      }
      .files {
        margin-top: 12px;
        display: flex;
        gap: 16px;
      }
      .empty {
        padding: 48px;
        text-align: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script id="diff-data" type="application/json">
      "__SCREENSHOT_DIFF_DATA__"
    </script>
    <script>
      'use strict';

      const VIEWS = [
        {id: 'diff', label: 'Diff', needs: ['diff']},
        {id: 'actual', label: 'Actual', needs: ['actual']},
        {id: 'expected', label: 'Expected', needs: ['expected']},
        {id: 'side', label: 'Side by side', needs: ['expected', 'actual']},
        {id: 'slider', label: 'Slider', needs: ['expected', 'actual']},
      ];

      // Creates an element. `attrs` may contain 'class', 'text', event handlers
      // ('onclick', ...) and any other attribute. Children can be nodes or strings.
      function el(tag, attrs = {}, ...children) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v === undefined) continue;
          if (k === 'class') e.className = v;
          else if (k === 'text') e.textContent = v;
          else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v);
        }
        for (const c of children) {
          if (c !== undefined) e.append(c);
        }
        return e;
      }

      function img(src) {
        return el('img', {src, alt: src});
      }

      function isAvailable(view, images) {
        return view.needs.every((r) => images[r] !== undefined);
      }

      function renderSlider(images) {
        const actual = img(images.actual);
        const expected = img(images.expected);
        const overlay = el('div', {class: 'overlay'}, expected);
        const divider = el('div', {class: 'divider'});
        const box = el(
          'div',
          {class: 'slider'},
          actual,
          overlay,
          divider,
          el('span', {class: 'label', style: 'left: 4px', text: 'Expected'}),
          el('span', {class: 'label', style: 'right: 4px', text: 'Actual'}),
        );
        const setPos = (pct) => {
          // Expected on the left of the divider, actual on the right.
          expected.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
          divider.style.left = `${pct}%`;
        };
        const onPointer = (e) => {
          const r = box.getBoundingClientRect();
          setPos(
            Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)),
          );
        };
        box.addEventListener('pointerdown', (e) => {
          box.setPointerCapture(e.pointerId);
          onPointer(e);
        });
        box.addEventListener('pointermove', (e) => {
          if (box.hasPointerCapture(e.pointerId)) onPointer(e);
        });
        // Keep the overlaid expected image the same rendered size as actual.
        actual.addEventListener('load', () => {
          expected.style.width = `${actual.clientWidth}px`;
        });
        new ResizeObserver(() => {
          expected.style.width = `${actual.clientWidth}px`;
        }).observe(actual);
        setPos(50);
        return box;
      }

      function renderView(viewId, images) {
        switch (viewId) {
          case 'side':
            return el(
              'div',
              {class: 'side-by-side'},
              el(
                'figure',
                {},
                el('figcaption', {text: 'Expected'}),
                img(images.expected),
              ),
              el(
                'figure',
                {},
                el('figcaption', {text: 'Actual'}),
                img(images.actual),
              ),
            );
          case 'slider':
            return renderSlider(images);
          default:
            return img(images[viewId]);
        }
      }

      // Builds one accordion card. Every available view is built once and
      // stacked (see the .view CSS); setView() only toggles which is visible.
      // Returns {node, setView}.
      function renderCard(f) {
        const view = el('div', {class: 'view'});
        const layers = new Map();
        for (const v of VIEWS) {
          if (!isAvailable(v, f.images)) continue;
          const layer = el('div', {class: 'layer'}, renderView(v.id, f.images));
          layers.set(v.id, layer);
          view.append(layer);
        }

        const setView = (viewId) => {
          // Fall back to 'actual' (always present) if e.g. there is no baseline.
          const id = layers.has(viewId) ? viewId : 'actual';
          for (const [lid, layer] of layers) {
            layer.classList.toggle('active', lid === id);
          }
        };

        const files = el('div', {class: 'files'});
        const dims = el('span');
        const actualImg = layers.get('actual').querySelector('img');
        actualImg.addEventListener('load', () => {
          dims.textContent = `${actualImg.naturalWidth} x ${actualImg.naturalHeight}`;
        });
        files.append(dims);
        for (const role of ['diff', 'actual', 'expected']) {
          const src = f.images[role];
          if (src !== undefined) {
            files.append(
              el('a', {href: src, target: '_blank', text: `${role}.png`}),
            );
          }
        }

        const summary = el(
          'summary',
          {},
          el('span', {class: 'card-title', text: f.testTitle}),
          el('span', {class: 'muted', text: '›'}),
          el('span', {text: f.screenshotName}),
          f.images.expected === undefined
            ? el('span', {class: 'muted', text: '(no baseline)'})
            : undefined,
          el('span', {class: 'spacer'}),
          f.reportUrl === undefined
            ? undefined
            : el('a', {
                href: f.reportUrl,
                target: '_blank',
                text: 'Open in Playwright report ↗',
                // Don't toggle the accordion when following the link.
                onclick: (e) => e.stopPropagation(),
              }),
        );

        const node = el(
          'details',
          {class: 'card', open: ''},
          summary,
          el('div', {class: 'card-body'}, view, files),
        );
        return {node, setView};
      }

      function renderCopyableCommand(cmd) {
        const button = el('button', {text: 'Copy'});
        button.addEventListener('click', async () => {
          await navigator.clipboard.writeText(cmd);
          button.textContent = 'Copied!';
        });
        return el(
          'div',
          {class: 'cmd-box'},
          el('span', {
            text: 'Accept these changes from your Perfetto checkout:',
          }),
          el('code', {text: cmd}),
          button,
        );
      }

      function main() {
        const root = document.getElementById('root');
        const data = JSON.parse(
          document.getElementById('diff-data').textContent,
        );
        if (typeof data !== 'object') {
          root.append(el('div', {class: 'empty', text: 'No data.'}));
          return;
        }
        const failures = data.failures;
        const n = failures.length;

        root.append(
          el(
            'header',
            {},
            el('h1', {text: 'Screenshot diffs'}),
            el('span', {
              class: 'muted',
              text: `${n} failing screenshot${n === 1 ? '' : 's'}`,
            }),
            el('span', {class: 'spacer'}),
            data.reportUrl === undefined
              ? undefined
              : el('a', {
                  href: data.reportUrl,
                  text: 'Full Playwright report ↗',
                }),
          ),
        );

        if (data.ciJobId !== undefined) {
          root.append(
            renderCopyableCommand(
              `tools/download_changed_screenshots.py ${data.ciJobId}`,
            ),
          );
        }

        const cards = failures.map(renderCard);

        // The single view switcher: sets every card to the same view at once,
        // which is the point of this page (bulk review).
        const segmented = el('div', {class: 'segmented'});
        const setAll = (viewId) => {
          for (const b of segmented.children) {
            b.classList.toggle('selected', b.dataset.view === viewId);
          }
          for (const c of cards) c.setView(viewId);
        };
        for (const v of VIEWS) {
          segmented.append(
            el('button', {
              'text': v.label,
              'data-view': v.id,
              'onclick': () => setAll(v.id),
            }),
          );
        }
        const setOpen = (open) => {
          for (const c of cards) c.node.open = open;
        };

        root.append(
          el(
            'div',
            {class: 'toolbar'},
            el('span', {class: 'toolbar-label', text: 'View'}),
            segmented,
            el('span', {class: 'spacer'}),
            el('button', {text: 'Expand all', onclick: () => setOpen(true)}),
            el('button', {text: 'Collapse all', onclick: () => setOpen(false)}),
          ),
        );
        for (const c of cards) root.append(c.node);
        setAll('diff');
      }

      main();
    </script>
  </body>
</html>
