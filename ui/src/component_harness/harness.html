<!--
 Component test harness. Mounts a single registered fixture in isolation so
 that Playwright can test widgets without booting the full UI. Only built when
 ui/build is run with --enable-component-harness; never shipped.

 Query string:
   fixture=<name>   fixture to mount, e.g. widgets/popup/scroll_container for
                    the 'scroll_container' export of widgets/popup.fixture.ts.
                    Omit for a list.
   theme=dark       use the dark theme (default light)
   <anything else>  passed to the fixture as string args
-->
<html>
<head>
<meta charset="utf-8">
<title>Perfetto component harness</title>
<link rel="stylesheet" href="./component_harness.css">
</head>
<body>
<script src="./component_harness_bundle.js"></script>
</body>
</html>
