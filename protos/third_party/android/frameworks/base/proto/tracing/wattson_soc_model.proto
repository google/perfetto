// Wattson SoC power model, carried in the trace as the
// FrameworksBaseTracePacket.wattson_soc_model extension. Source of truth lives
// at frameworks/base/proto/tracing/ in the Android tree.

syntax = "proto2";

package com.android.internal;

// CPU cpufreq policy cluster definition and per-policy configuration (replaces
// hardcoded rows in Perfetto's device_infos.sql).
message WattsonCpuPolicy {
  optional uint32 policy = 1;
  // Physical CPU core indices belonging to this policy cluster.
  repeated uint32 cpus = 2 [packed = true];
  // Deep idle time offset for this policy cluster (in nanoseconds).
  optional int64 deep_idle_offset_ns = 3;
  // Whether this policy cluster's 2D dependency votes by frequency.
  optional bool vote_by_freq = 4;
}

// Mapping from nominal kernel cpuidle states to override curve column indices.
message WattsonIdleStateMap {
  optional int64 nominal_idle = 1;
  optional int64 override_idle = 2;
}

// Idle power values are carried in a single packed `idle_mw` array rather than
// one field per idle level, so that a SoC with more idle levels does not need a
// schema change. The array is ordered from the shallowest idle level to the
// deepest, as defined by the curve set for that subsystem; a consumer maps the
// index onto its own idle-state numbering. Trailing levels a curve set does not
// characterise are simply absent, and the array is empty when the curve set
// carries no idle data at all.
//
// Power is expressed in milliwatts as `float`: rail measurements carry three to
// four significant digits, so the ~7 digits of a single-precision value are far
// more than the data supports, and it halves the wire cost of a curve table.

// Unified CPU power curve entry covering 1D per-policy curves (when dep_policy
// and dep_freq_khz are unset) and 2D inter-cluster dependency curves (including
// shared interconnect power and L3 cache hit/miss coefficients).
message WattsonCpuCurve {
  optional uint32 policy = 1;
  optional uint32 freq_khz = 2;
  // Present only for 2D dependency curves:
  optional uint32 dep_policy = 3;
  optional uint32 dep_freq_khz = 4;

  optional float static_mw = 5;
  optional float active_mw = 6;
  repeated float idle_mw = 7 [packed = true];

  // Shared interconnect and L3 cache hit/miss coefficients for 2D curves:
  optional float interconnect_mw = 8;
  optional float l3_hit_mw = 9;
  optional float l3_miss_mw = 10;
}

// Generic power curve entry for non-CPU subsystems (e.g. "gpu", "tpu", and
// future accelerators).
message WattsonSubsystemCurve {
  // Subsystem identifier (e.g. "gpu", "tpu").
  optional string subsystem = 1;
  // Subsystem domain or cluster index (e.g. TPU cluster ID; 0 when omitted).
  optional uint32 domain = 2;
  optional uint32 freq_khz = 3;
  // Active power in mW. Contains a single value for standard DVFS subsystems
  // (e.g. GPU), or values ordered by concurrent request count (0, 1, ...) for
  // request-scaled subsystems (e.g. TPU).
  repeated float active_mw = 4 [packed = true];
  // Idle power in mW ordered from shallowest to deepest idle level.
  repeated float idle_mw = 5 [packed = true];
}

// Wattson SoC power model definition containing device hardware topology
// and empirical power curves.
message WattsonSocModel {
  // Canonical SoC model name (e.g. "Tensor G6").
  optional string device_name = 1;
  // Monotonic version number.
  optional uint32 model_version = 2;
  // Whether DSU frequency comes from linux_devfreq_dsu_counter.
  optional bool use_devfreq = 3;
  // GPU instance ID in trace.
  optional int32 gpu_id = 4;

  repeated WattsonCpuPolicy cpu_policies = 5;
  repeated WattsonIdleStateMap idle_state_map = 6;

  repeated WattsonCpuCurve cpu_curves = 7;
  repeated WattsonSubsystemCurve subsystem_curves = 8;
}
