syntax = "proto2";

package perfetto.protos;

// next id: 25
message GpuRenderStageEvent {
  // required. Unique ID for the event.
  optional uint64 event_id = 1;

  // optional. Duration of the event in nanoseconds. If unset, this is a
  // single time point event.
  optional uint64 duration = 2;

  // required. ID to a hardware queue description in the specifications.
  // InternedGpuRenderStageSpecification
  optional uint64 hw_queue_iid = 13;

  // required. ID to a render stage description in the specifications.
  // InternedGpuRenderStageSpecification
  optional uint64 stage_iid = 14;

  // optional. Identifier for GPU in a multi-gpu device.
  optional int32 gpu_id = 11;

  // required. Graphics context for the event.
  // For OpenGL, this is the GL context.
  // For Vulkan, this is the VkDevice.
  optional uint64 context = 5;

  // optional. The render target for this event.
  // For OpenGL, this is the GL frame buffer handle.
  // For Vulkan, this is the VkFrameBuffer handle.
  optional uint64 render_target_handle = 8;

  // optional. Submission ID generated by the UMD.
  // For OpenGL, the ID should map to an API submission (e.g., glFlush,
  // glFinish, eglSwapBufffers) event.  The set of submissions to the HW due
  // to a single API submission should share the same ID.
  // For Vulkan, it should map 1:1 with a vkQueueSubmit.
  optional uint32 submission_id = 10;

  // optional. Additional data for the user. This may include attributes for
  // the event like resource ids, shaders, etc.
  message ExtraData {
    optional string name = 1;
    optional string value = 2;
  }
  repeated ExtraData extra_data = 6;

  // VULKAN SPECIFICS

  // optional. The Vulkan render pass handle.
  optional uint64 render_pass_handle = 9;

  // Identifies one render pass execution (vkCmdBeginRenderPass or
  // vkCmdBeginRendering). All stages of that execution that have a standard
  // value (BINNING + RENDER, tile flushes, subpasses, suspended/resumed
  // rendering) share the same value. A stage outside a render pass (for
  // example COMPUTE, a copy or blit, an acceleration structure build, OTHER)
  // leaves it unset. Optional on a CUSTOM stage; when set, it is the value of
  // the render pass execution that the stage belongs to.
  // Unique within one submission (submission_id). Values follow the command
  // buffer order in the submission, then the recording order inside each
  // command buffer. A later submission can repeat the same values, so tools
  // use (submission_id, render_pass_instance_id) as the key.
  optional uint64 render_pass_instance_id = 16;

  // optional. A bit mask representing which render subpasses contributed to
  // this render stage event.  Subpass index 0 is represented by setting the
  // LSB of the mask.  Additional mask can be added for subpass index greater
  // than 63.
  repeated uint64 render_subpass_index_mask = 15;

  // optional. The Vulkan command buffer handle.
  optional uint64 command_buffer_handle = 12;

  // optional. Custom name for this render stage event. When set, this
  // provides a name for the stage instead of using the name from the stage
  // specification.
  oneof name_field {
    string name = 17;
    // Interned event name. Refers to EventName in InternedData.
    uint64 name_iid = 20;
  }

  // Event IDs of other GpuRenderStageEvents that this event
  // had to wait on before it could run.
  repeated uint64 event_wait_ids = 18;

  // optional. ID to a compute kernel description in the interned data.
  // InternedComputeKernel
  optional uint64 kernel_iid = 19;

  // 3D unsigned integer vector for grid and workgroup dimensions.
  message Dim3 {
    optional uint32 x = 1;
    optional uint32 y = 2;
    optional uint32 z = 3;
  }

  // Typed key/value argument for extending compute kernel descriptions
  // and launch parameters with custom data.
  message ExtraComputeArg {
    oneof name_field {
      // Interned InternedComputeArgName.
      uint64 name_iid = 1;
      // Non-interned variant.
      string name = 2;
    }
    oneof value {
      int64 int_value = 3;
      uint64 uint_value = 4;
      double double_value = 5;
      string string_value = 6;
      // Interned InternedString via debug_annotation_string_values.
      uint64 string_value_iid = 7;
    }
  }

  // Compute kernel launch parameters for a single dispatch.
  message ComputeKernelLaunch {
    // Grid dimensions (number of workgroups in each dimension).
    optional Dim3 grid_size = 1;
    // Workgroup dimensions (number of threads per workgroup in each dimension).
    optional Dim3 workgroup_size = 2;
    // Additional typed launch parameters (e.g. registers_per_thread,
    // shared_mem_dynamic, shared_mem_static).
    repeated ExtraComputeArg args = 3;
  }

  // optional. Compute kernel launch parameters for this event.
  optional ComputeKernelLaunch launch = 21;

  // optional. Producer-defined logical queue (e.g. a CUDA stream) the event was
  // submitted to. The ID is scoped to the process of the event's graphics
  // `context`. See GpuTrackDescriptor.logical_queue_id.
  optional uint64 logical_queue_id = 22;

  // event_id of the parent stage of a child stage. The child is a CUSTOM
  // stage that divides the work of its parent, or a stage that a CUSTOM
  // wrapper groups. Both shapes can nest. A stage with a standard value is
  // never inside another stage with a standard value (see StandardStage).
  // In both shapes, the child lies inside the time range of its parent: it
  // does not start before its parent starts and does not end after its parent
  // ends.
  optional uint64 parent_event_id = 23;

  // GPU action commands that this stage serves, for stages other than BINNING
  // and RENDER stages (dispatch, ray tracing dispatch, data graph dispatch,
  // acceleration structure command, copy, fill, blit, resolve, clear, other
  // recorded command, or a CUSTOM child stage of any parent). BINNING and
  // RENDER stages correlate via render_pass_instance_id and leave
  // command_instance_id empty.
  // Each value is unique within one submission (submission_id). Values follow
  // the command buffer order in the submission, then the recording order
  // inside each command buffer. A later submission can repeat the same values,
  // so tools use (submission_id, value) as the key.
  // A stage of one command has one value, and all stages that the command
  // emits share it. A stage that serves several commands lists each of them.
  // Empty on pass-level stages or when served commands are unknown. Optional
  // on a CUSTOM stage; when set, the same rules apply to the values.
  repeated uint64 command_instance_id = 24 [packed = true];

  // DEPRECATED

  // Deprecated.  Use InternedGpuRenderStageSpecification instead.
  // The first trace packet of each session should include a Specifications
  // to enumerate *all* IDs that will be used. The timestamp of this packet
  // must be earlier than all other packets. Only one packet with Specifications
  // is expected.
  message Specifications {
    message ContextSpec {
      optional uint64 context = 1;
      optional int32 pid = 2;
    }
    optional ContextSpec context_spec = 1;

    message Description {
      optional string name = 1;
      optional string description = 2;
    }

    // Labels to categorize the hw Queue this event goes on.
    repeated Description hw_queue = 2;

    // Labels to categorize render stage(binning, render, compute etc).
    repeated Description stage = 3;
  }
  // Deprecated.  Use hw_queue_iid and stage_iid to refer to
  // InternedGpuRenderStageSpecification instead.
  optional Specifications specifications = 7 [deprecated = true];

  // Deprecated. Use hw_queue_iid instead;
  optional int32 hw_queue_id = 3 [deprecated = true];

  // Deprecated. Use stage_iid instead;
  optional int32 stage_id = 4 [deprecated = true];

  // Extension for vendor's custom proto.
  extensions 100;
}

// Classification rule for stages with a standard value (any value except
// UNSPECIFIED and CUSTOM):
// 1. Work inside a render pass is BINNING or RENDER. This includes clear
//    commands, attachment clears, and resolve attachments of the pass.
// 2. Work that a recorded command outside a render pass produces gets the
//    value of that command, even when the GPU runs it on a different engine.
// 3. Work that no single recorded command requests is PRESENT when it is
//    present work, ACCELERATION_STRUCTURE when it builds acceleration
//    structures for several commands, and DRIVER_INTERNAL otherwise (for
//    example, a driver shader that computes constants for many commands).
// A stage with a standard value is work, and tools add its time. It is never
// inside another stage with a standard value, at any depth of
// parent_event_id. Tools do not add the time of a CUSTOM stage on its own:
// time in a CUSTOM wrapper that is in no stage with a standard value is not
// counted as work.
enum StandardStage {
  // Not classified. Same as an unset field; a producer does not write this
  // value.
  STANDARD_STAGE_UNSPECIFIED = 0;
  // Separate pre-raster pass: vertex/position shading, primitive setup, tile
  // binning.
  STANDARD_STAGE_BINNING = 1;
  // Raster/fragment work and any vertex work in the same pass: IMR or direct-
  // mode draws, TBDR tile pass (incl. per-tile vertex replay and tile
  // load/store), clears and resolve attachments of the pass.
  STANDARD_STAGE_RENDER = 2;
  // Compute dispatches (direct and indirect).
  STANDARD_STAGE_COMPUTE = 3;
  // Ray tracing dispatches (direct and indirect).
  STANDARD_STAGE_RAY_TRACING = 4;
  // Acceleration structure builds (also builds batched across commands),
  // copies, and serialization.
  STANDARD_STAGE_ACCELERATION_STRUCTURE = 5;
  // Neural network and ML dispatches: data graph and tensor dispatches (for
  // example VK_ARM_data_graph).
  STANDARD_STAGE_NEURAL = 6;
  // Buffer and image copies, buffer updates, query result copies.
  STANDARD_STAGE_TRANSFER = 7;
  // Image clears and buffer fills outside a render pass.
  STANDARD_STAGE_CLEAR = 8;
  // Resolve commands outside a render pass.
  STANDARD_STAGE_RESOLVE = 9;
  // Image blits, including scaling and format conversion.
  STANDARD_STAGE_BLIT = 10;
  // Present work that the driver or window system adds: pre-rotation, format-
  // conversion present blits.
  STANDARD_STAGE_PRESENT = 11;
  // Other work that no single recorded command requests: decompression, fast-
  // clear eliminate, driver shaders that serve many commands.
  STANDARD_STAGE_DRIVER_INTERNAL = 12;
  // Work of a recorded command that no other value describes: queries, video
  // coding. Not a vendor value: the stage is linked to its command with
  // command_instance_id as for the values above, and its time counts.
  STANDARD_STAGE_OTHER = 13;
  // Vendor stage. Tools do not add its time on its own. Use it for:
  // - a child stage that divides the work of its parent, for example a
  //   draw call in a RENDER stage (parent_event_id set);
  // - a wrapper that groups other stages, for example the stages of one
  //   render pass or of one submission.
  // render_pass_instance_id and command_instance_id are optional. When
  // set, they follow the rules of those fields.
  STANDARD_STAGE_CUSTOM = 14;
}

// Interned data.

// The iid is the numeric value of either the GL Context or the VkDevice
// handle.
message InternedGraphicsContext {
  optional uint64 iid = 1;
  optional int32 pid = 2;
  enum Api {
    UNDEFINED = 0;
    OPEN_GL = 1;
    VULKAN = 2;
    OPEN_CL = 3;
    CUDA = 4;
    HIP = 5;
  }
  optional Api api = 3;
}

message InternedGpuRenderStageSpecification {
  optional uint64 iid = 1;
  optional string name = 2;
  optional string description = 3;

  enum RenderStageCategory {
    OTHER = 0;
    GRAPHICS = 1;
    COMPUTE = 2;
  }
  optional RenderStageCategory category = 4;

  // Standard category of this stage. Stages with a standard value follow the
  // rule in StandardStage; CUSTOM marks a vendor child stage or a vendor
  // wrapper.
  optional StandardStage standard_stage = 5;
}

message InternedComputeKernel {
  optional uint64 iid = 1;
  optional string name = 2;
  optional string demangled_name = 3;
  optional string arch = 4;
  // Additional typed kernel attributes (e.g. static resource limits).
  repeated GpuRenderStageEvent.ExtraComputeArg args = 5;
}

message InternedComputeArgName {
  optional uint64 iid = 1;
  optional string name = 2;
}
