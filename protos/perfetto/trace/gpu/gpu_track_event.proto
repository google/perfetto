syntax = "proto2";

package perfetto.protos;

import public "protos/perfetto/trace/track_event/track_descriptor.proto";
import public "protos/perfetto/trace/track_event/track_event.proto";

// GPU API type for tagging track events.
// Values intentionally match InternedGraphicsContext.Api in
// gpu_render_stage_event.proto.
enum GpuApi {
  GPU_API_UNDEFINED = 0;
  GPU_API_OPEN_GL = 1;
  GPU_API_VULKAN = 2;
  GPU_API_OPEN_CL = 3;
  GPU_API_CUDA = 4;
  GPU_API_HIP = 5;
}

// Correlates a track event with GPU render stage events.
message GpuCorrelation {
  // Event IDs of GpuRenderStageEvents that this track event submitted.
  repeated uint64 render_stage_submission_event_ids = 1;

  // Event IDs of GpuRenderStageEvents that this track event waited on
  // to complete.
  repeated uint64 render_stage_wait_event_ids = 2;
}

message GpuTrackEvent {
  extend TrackEvent {
    // Correlates this track event with GPU render stage events.
    optional GpuCorrelation gpu_correlation = 3000;

    // GPU API that this track event represents a call to.
    optional GpuApi gpu_api = 3001;
  }
}

// Marks a TrackDescriptor as belonging to a GPU timeline.
message GpuTrackDescriptor {
  // Optional identifier for the GPU in a multi-GPU device. This uses the same
  // namespace as GpuRenderStageEvent.gpu_id. A global, non-queue descriptor
  // which introduces a concrete GPU ID is the placement anchor for existing
  // tracks belonging to that GPU. Producers should emit at most one such
  // anchor per (machine, GPU ID); descendants inherit the ID.
  optional int32 gpu_id = 1;

  // Associates this exact descriptor track with a render-stage queue. The
  // descriptor's name, parent, ordering, and sibling merge fields control the
  // corresponding render-stage track in the UI.
  oneof render_stage_queue {
    // Hardware queue ID scoped to the descriptor packet's trusted packet
    // sequence, matching GpuRenderStageEvent.hw_queue_iid. Producers MUST keep
    // this ID stable and MUST NOT reuse it for a different queue after an
    // incremental-state reset.
    uint64 hw_queue_iid = 2;

    // Process-scoped logical queue ID. The process is inherited through a
    // parent process TrackDescriptor.
    uint64 logical_queue_id = 3;
  }
}

message GpuTrackDescriptorExtension {
  extend TrackDescriptor {
    // Associates this track, and by inheritance its descendants, with a GPU.
    optional GpuTrackDescriptor gpu_track = 3000;
  }
}
