syntax = "proto2";

package perfetto.protos;

// A named, typed key/value which is part of a track's identity.
//
// Dimensions are the single vocabulary for identifiers which apply to a set of
// tracks: *well-known* dimensions are synthesized by trace processor, while
// producers can declare their own *custom* dimensions (`rank`, `shard`,
// `stage`, ...) on a TrackDescriptor.
//
// Reserved names: the names of the well-known dimensions are reserved and
// cannot be used for custom dimensions. They are:
//  * `machine`: the machine the track belongs to.
//  * `gpu`: the GPU the track belongs to.
//  * `cpu`: the CPU the track belongs to.
//  * `process`: the process the track belongs to.
//  * `thread`: the thread the track belongs to.
// Their values are derived by trace processor from the typed fields of the
// TrackDescriptor (e.g. `process`, `thread`) and from import context, and mean
// the same thing across data sources. A custom dimension using a reserved name
// is ignored and trace processor records the
// `track_descriptor_reserved_dimension_name` import error.
//
// A dimension has no scope field: it is declared on the track described by the
// containing TrackDescriptor and applies to that track plus:
//  * every track associated with the same process, if declared on a process
//    track,
//  * every track associated with the same thread, if declared on a thread
//    track,
//  * every `parent_uuid` descendant, if declared on any other track.
//
// Declaring a *different* value for a dimension name which is already
// inherited from an ancestor is invalid: trace processor records an import
// error and keeps the inherited value.
//
// The dimensions declared on a TrackDescriptor (names and values; the order
// and `display_name` don't matter) are part of the identity of that track:
//  * they are fixed for the lifetime of the track, so every TrackDescriptor
//    emitted for a given `uuid`, including the first one, must declare the
//    same dimensions. A TrackDescriptor declaring different dimensions is
//    rejected as a conflicting reservation and the first one is kept.
//  * sibling tracks are only merged (see
//    `TrackDescriptor.sibling_merge_behavior`) if they declare the same
//    dimensions.
message TrackDimension {
  // The canonical dimension key, e.g. "rank". Must be non-empty and must not
  // be one of the reserved names listed above.
  optional string name = 1;

  // The typed value of the dimension. This is the value used for SQL queries,
  // track identity and (for well-known dimensions) merging, so it must be
  // stable for the whole trace.
  oneof value {
    int64 int_value = 2;
    string string_value = 3;
    // Interned version of `string_value`: corresponds to the
    // `debug_annotation_string_values` field in InternedData, looked up in the
    // interned data of the sequence the TrackDescriptor is emitted on. The
    // resolved string is the value, so an interned and an inline string with
    // the same contents are the same value.
    uint64 string_value_iid = 5;
  }

  // Optional human readable label for this *value*, e.g. "worker-east" for
  // rank 7. Only affects presentation: the canonical typed value above is what
  // SQL and merging use.
  optional string display_name = 4;
}
