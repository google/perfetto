syntax = "proto2";

package perfetto.protos;

// Description of GPU counters.
// This message is sent by a GPU counter producer to specify the counters
// available in the hardware.
message GpuCounterDescriptor {
  // Logical groups for a counter.  This is used in the UI to present the
  // related counters together.
  enum GpuCounterGroup {
    UNCLASSIFIED = 0;
    SYSTEM = 1;
    VERTICES = 2;
    FRAGMENTS = 3;
    PRIMITIVES = 4;
    // Includes counters relating to caching and bandwidth.
    MEMORY = 5;
    COMPUTE = 6;
    RAY_TRACING = 7;
  }

  // Cross-vendor counter categories for portable tooling and SQL queries.
  // Producers keep their native counter_id, name, and descriptions on the
  // GpuCounterSpec and tag the matching spec with standard_counter.
  enum StandardCounter {
    STANDARD_COUNTER_UNSPECIFIED = 0;
    // Active cycles on the primary GPU clock over the interval.
    STANDARD_COUNTER_GPU_ACTIVE_CYCLES = 1;
    // Input primitives submitted to geometry assembly before culling.
    STANDARD_COUNTER_INPUT_PRIMITIVES = 2;
    // Fragments dispatched to fragment shader execution after early
    // depth/stencil tests.
    STANDARD_COUNTER_SHADED_FRAGMENTS = 3;
    // Percentage saturation of shader arithmetic capacity while shader cores
    // are active.
    STANDARD_COUNTER_ALU_UTILIZATION = 4;
    // Percentage of active shader-core cycles processing texture sampling or
    // filtering requests.
    STANDARD_COUNTER_TEXTURE_UTILIZATION = 5;
    // Percentage of GPU L2 cache read lookups satisfied by L2 cache hits.
    STANDARD_COUNTER_L2_CACHE_READ_HIT_RATIO = 6;
    // External memory read throughput in bytes per second across GPU clients.
    STANDARD_COUNTER_MEMORY_READ_BANDWIDTH = 7;
    // External memory write throughput in bytes per second across GPU clients.
    STANDARD_COUNTER_MEMORY_WRITE_BANDWIDTH = 8;
  }

  message GpuCounterSpec {
    optional uint32 counter_id = 1;
    optional string name = 2;
    // Full description of the counter. May use Markdown to explain hardware
    // semantics, interpretation, and bottlenecks for users and AI agents.
    optional string description = 3;
    // MeasureUnit unit (deprecated)
    reserved 4;
    oneof peak_value {
      int64 int_peak_value = 5;
      double double_peak_value = 6;
    }
    repeated MeasureUnit numerator_units = 7;
    repeated MeasureUnit denominator_units = 8;
    optional bool select_by_default = 9;
    repeated GpuCounterGroup groups = 10;

    // Direction of the time interval that each emitted sample applies to.
    // A GPU counter is sampled at discrete timestamps, but its value really
    // represents a measurement over some interval around that timestamp
    // (e.g. average GPU utilization over the sampling window). This field
    // tells trace processor on which side of the timestamp that interval
    // lies, which controls where the value is drawn in the UI.
    //
    // Example: samples at t=10, 20, 30 with values 5, 7, 0.
    //   BACKWARDS_LOOKING: 5 covers (-inf, 10], 7 covers (10, 20], 0 covers
    //     (20, 30]; the UI draws 7 between t=10 and t=20.
    //   FORWARDS_LOOKING:  5 covers [10, 20), 7 covers [20, 30), 0 covers
    //     [30, +inf); the UI draws 5 between t=10 and t=20.
    enum ValueDirection {
      // Treated as BACKWARDS_LOOKING (the historical default).
      VALUE_DIRECTION_UNSPECIFIED = 0;
      // The value applies to the interval ending at this event's timestamp.
      // This is the convention used by AGI and most existing GPU producers,
      // where a sample reports what happened during the window leading up
      // to the timestamp.
      VALUE_DIRECTION_BACKWARDS_LOOKING = 1;
      // The value applies to the interval starting at this event's
      // timestamp, matching standard Perfetto counters. Producers that emit
      // explicit zero samples to denote "no activity from here on" should
      // use this so the zero is not back-propagated over earlier non-zero
      // samples (https://github.com/google/perfetto/issues/5683).
      VALUE_DIRECTION_FORWARDS_LOOKING = 2;
    }
    optional ValueDirection value_direction = 11;

    // Concise plain-text summary for counter selection dialogs and compact UI
    // lists.
    optional string short_description = 12;

    // How to aggregate the samples of this counter.
    enum ValueType {
      VALUE_TYPE_UNSPECIFIED = 0;
      // Count since the previous sample.
      VALUE_TYPE_INCREMENTAL_SUM = 1;
      // Rate per second over the interval.
      VALUE_TYPE_PER_TIME_RATE = 2;
      // Percentage (0 to 100) of the interval.
      VALUE_TYPE_PERCENT = 3;
    }
    optional ValueType value_type = 13;

    message Derivation {
      // Tools can use the formula to recompute the value over a different time
      // range. Then dt_s is the duration of that range.
      //
      // How this derived counter is computed for each sample interval, either
      // as a math expression or as the exact string "OPAQUE":
      //
      // 1. Math expression (evaluated as double; division by zero yields 0.0):
      //    - $<counter_id> : sample value of counter <counter_id> (e.g. $246)
      //    - dt_s          : sample interval duration in seconds
      //    - OPAQUE        : one per-sample value that only the driver knows
      //    - Numbers       : integer, decimal, or scientific (100, 4.0, 1e-9)
      //    - Operators     : +, -, *, /, unary +/-, parentheses (...)
      //    - Functions     : min(a, b), max(a, b)
      //    Examples:
      //      "100.0 * ($246 / ($246 + $247))"   // percentage from two counters
      //      "($195 * 64.0) / dt_s"             // bytes/sec from 64B beats
      //      "min(100.0, max(0.0, $12 - $15))"  // clamped difference
      //      "100.0 * OPAQUE / $123"            // driver-only count over $123
      //    Every $<counter_id> in the expression MUST match source_counter_ids
      //    (same set of IDs, none extra or missing).
      //    OPAQUE appears at most once, as a factor of the whole expression
      //    (never in a divisor). The rest of that expression uses only
      //    $<counter_id>, dt_s, numbers, *, /, and parentheses, so tools can
      //    solve for OPAQUE in each sample.
      //
      // 2. "OPAQUE" (exact string as the whole formula; nothing is exposed):
      //    Use when the calculation depends on internal driver state, lookup
      //    tables, multi-sample smoothing, or unsupported operations. Explain
      //    the metric in `description`.
      optional string formula = 1;

      // Unique counter_id values (raw or derived) from this
      // GpuCounterDescriptor that feed this counter. Must have no
      // self-references or dependency cycles. Still lists any exposed input
      // counters when formula == "OPAQUE" (empty only if no inputs are exposed
      // counters).
      repeated uint32 source_counter_ids = 2;
    }
    // Set on counters that the producer computes from other counters or state.
    optional Derivation derivation = 14;

    // Optional cross-vendor counter identity mapped 1-to-1 to this spec.
    optional StandardCounter standard_counter = 15;
  }
  repeated GpuCounterSpec specs = 1;

  // Allow producer to group counters into block to represent counter islands.
  // A capacity may be specified to indicate the number of counters that can be
  // enable simultaneously in that block.
  message GpuCounterBlock {
    // required. Unique ID for the counter group.
    optional uint32 block_id = 1;
    // optional. Number of counters supported by the block. No limit if unset.
    optional uint32 block_capacity = 2;
    // optional. Name of block.
    optional string name = 3;
    // optional. Description for the block.
    optional string description = 4;
    // list of counters that are part of the block.
    repeated uint32 counter_ids = 5;
  }
  repeated GpuCounterBlock blocks = 2;

  // Allow producer to define custom counter groups. Unlike the fixed
  // GpuCounterGroup enum (which provides broad categories), these groups
  // let the producer define hardware-specific groupings that the UI uses
  // to organize counter tracks. Can also be used to provide display names
  // and descriptions for the fixed GpuCounterGroup enum values by setting
  // group_id to the enum value.
  message GpuCounterGroupSpec {
    // required. Unique ID for this group within the descriptor.
    optional uint32 group_id = 1;
    // optional. Display name for the group.
    optional string name = 2;
    // optional. Description of the group.
    optional string description = 3;
    // Counters that belong directly to this group (by counter_id).
    repeated uint32 counter_ids = 4;
  }
  repeated GpuCounterGroupSpec counter_groups = 6;

  // optional.  Minimum sampling period supported by the producer in
  // nanoseconds.
  optional uint64 min_sampling_period_ns = 3;

  // optional.  Maximum sampling period supported by the producer in
  // nanoseconds.
  optional uint64 max_sampling_period_ns = 4;

  // optional.  The producer supports counter sampling by instrumenting the
  // command buffer.
  optional bool supports_instrumented_sampling = 5;

  // optional.  The producer supports selecting counters by name via
  // GpuCounterConfig.counter_names. Not all producers support this; Android
  // GPU producers typically do not.
  optional bool supports_counter_names = 7;

  // optional.  The producer supports glob patterns in
  // GpuCounterConfig.counter_names for matching multiple counters by name.
  optional bool supports_counter_name_globs = 8;

  // next id: 42
  enum MeasureUnit {
    NONE = 0;

    BIT = 1;
    KILOBIT = 2;
    MEGABIT = 3;
    GIGABIT = 4;
    TERABIT = 5;
    PETABIT = 6;

    BYTE = 7;
    KILOBYTE = 8;
    MEGABYTE = 9;
    GIGABYTE = 10;
    TERABYTE = 11;
    PETABYTE = 12;

    HERTZ = 13;
    KILOHERTZ = 14;
    MEGAHERTZ = 15;
    GIGAHERTZ = 16;
    TERAHERTZ = 17;
    PETAHERTZ = 18;

    NANOSECOND = 19;
    MICROSECOND = 20;
    MILLISECOND = 21;
    SECOND = 22;
    MINUTE = 23;
    HOUR = 24;

    VERTEX = 25;
    PIXEL = 26;
    TRIANGLE = 27;
    PRIMITIVE = 38;
    FRAGMENT = 39;

    MILLIWATT = 28;
    WATT = 29;
    KILOWATT = 30;

    JOULE = 31;
    VOLT = 32;
    AMPERE = 33;

    CELSIUS = 34;
    FAHRENHEIT = 35;
    KELVIN = 36;

    // Values should be out of 100.
    PERCENT = 37;

    INSTRUCTION = 40;
    // Clock cycles.
    CYCLE = 41;
  }
}
