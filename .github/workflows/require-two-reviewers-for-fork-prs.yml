# This workflow requires that pull requests coming from a forked repo (hence
# non-googlers) have 2 reviews from Google organization members.
#
# SECURITY: this deliberately uses pull_request_target, NOT pull_request.
# Under pull_request_target GitHub always runs the copy of this file from the
# base branch, so a fork PR cannot edit the check that gates it. This is safe
# only as long as this workflow:
#   1. never checks out or executes code from the PR, and
#   2. never interpolates attacker-controlled text (PR title, body, branch
#      name, ...) into a script. Pass values through env: instead.
# Keep it that way.

name: Enforce 2 Google org member reviews for fork PRs

on:
  pull_request_target:
    types: [opened, synchronize, labeled, edited, auto_merge_enabled, auto_merge_disabled]

permissions:
  pull-requests: read

concurrency:
  group: enforce-reviews-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce-reviews:
    # Deliberately run on GitHub's ubuntu-latest pool as it's faster for small
    # job like this.
    runs-on: ubuntu-latest
    steps:
      - name: Check Google org member reviews
        # Non-fork PRs: the step is skipped and the job passes.
        if: github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LATEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          exit 0
