# Opens a pull request against the Bazel Central Registry
# (https://github.com/bazelbuild/bazel-central-registry) adding the released
# version of the `perfetto` module.
#
# Triggered when a maintainer publishes the GitHub release. Can also be
# dispatched manually to retry a failed publish.
#
# The registry entry points at the source archive GitHub generates for the
# release tag. MODULE.bazel does not carry the release version: the entry
# includes a patch, generated by the publish workflow, which sets it.
#
# The entry is generated from the templates in //.bcr, read from the release
# tag. To republish a release whose templates were broken, dispatch manually
# with `templates_ref` pointing at a ref with the fixed templates.
#
# Requires:
# - The `BCR_REGISTRY_FORK` repository variable: a fork of the registry
#   (e.g. some-user/bazel-central-registry) where the branch for the pull
#   request is pushed.
# - The `BCR_PUBLISH_TOKEN` repository secret: a classic PAT with "repo" and
#   "workflow" scopes, from an account with push access to that fork.

name: Publish to Bazel Central Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. v54.0)'
        required: true
        type: string
      templates_ref:
        description: 'Git ref to read the .bcr templates from (defaults to the release tag)'
        required: false
        type: string

permissions: {}

jobs:
  publish:
    # Pre-releases are not published to the registry. The job is skipped
    # until the registry fork is configured.
    if: >-
      github.repository == 'google/perfetto' &&
      vars.BCR_REGISTRY_FORK != '' &&
      (github.event_name == 'workflow_dispatch' ||
       !github.event.release.prerelease)
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0
    with:
      tag_name: ${{ inputs.version || github.event.release.tag_name }}
      templates_ref: ${{ inputs.templates_ref }}
      registry_fork: ${{ vars.BCR_REGISTRY_FORK }}
      # Attestations are only accepted by the registry when the archive is
      # produced by the bazel-contrib release_ruleset workflow.
      attest: false
      download_default_release_artifacts: false
      # The pull request is opened by a bot account: a maintainer listed in
      # .bcr/metadata.template.json approves it.
      draft: false
    permissions:
      contents: read
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
